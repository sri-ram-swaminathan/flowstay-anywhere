name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build:pages

  e2e:
    # Real on-device inference: downloads each model, dictates a speech clip, checks the transcript.
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:pages
      - run: curl -L -o jfk.wav https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/main/jfk.wav
      - name: Dictation end-to-end
        run: |
          npx vite preview --port 4173 --strictPort &
          sleep 3
          node tests/e2e.mjs http://localhost:4173/ "$PWD/jfk.wav"
