name: Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Build installer and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Flowstay Anywhere v__VERSION__
          releaseBody: |
            **Windows:** download `Flowstay_x.y.z_x64-setup.exe` below and run it.
            Windows SmartScreen may warn because the installer isn't code-signed: click *More info → Run anyway*.

            **iPhone:** open https://sri-ram-swaminathan.github.io/flowstay-anywhere/ in Safari → Share → Add to Home Screen.
          releaseDraft: false
          prerelease: false
      - uses: actions/upload-artifact@v4
        with:
          name: flowstay-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
